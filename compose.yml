services:
  ravendb:
    image: ravendb/ravendb:7.1-latest
    container_name: consigliere-ravendb
    restart: unless-stopped
    environment:
      RAVEN_License_Eula_Accepted: "true"
      RAVEN_Setup_Mode: "None"
      RAVEN_Security_UnsecuredAccessAllowed: "PrivateNetwork"
      RAVEN_PublicServerUrl: "http://ravendb:8080"
    # Raven is reachable only inside the docker network. It used
    # to publish 8080 to the host; wave-A3 S0 removes that so the
    # only public surfaces are Caddy's :80 + :443.
    expose:
      - "8080"
    volumes:
      - raven-data:/var/lib/ravendb/data

  consigliere:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: consigliere-app
    restart: unless-stopped
    depends_on:
      ravendb:
        condition: service_started
    environment:
      DOTNET_ENVIRONMENT: DockerComposeE2E
      ASPNETCORE_ENVIRONMENT: DockerComposeE2E
      ASPNETCORE_HTTP_PORTS: "5000"
    # wave-A3 S0: Kestrel is internal-only. Caddy is the only
    # public surface, and TLS terminates there.
    expose:
      - "5000"

  # wave-A3 S0 — local-dev TLS termination via Caddy's bundled
  # self-signed CA (`tls internal`). Production termination lives
  # in `compose.prod.yml` as an override file so its mandatory env
  # vars (CADDY_DOMAIN + CADDY_EMAIL) do NOT leak into the dev
  # interpolation pass — S0-audit M1 fix.
  caddy-dev:
    image: caddy:2-alpine
    container_name: consigliere-caddy-dev
    profiles: ["dev"]
    restart: unless-stopped
    depends_on:
      - consigliere
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ./infrastructure/caddy/snippets:/etc/caddy/snippets:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  raven-data:
  caddy-data:
  caddy-config:

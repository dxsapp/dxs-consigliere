name: ci-tests

on:
  push:
    branches:
      - main
      - "codex-*"
      - "codex/*"
  pull_request:

jobs:
  # wave-A3 S5 — fail red if any `src/Dxs.Consigliere/
  # appsettings*.json` reintroduces a plaintext API key / password
  # / secret / token. Owned by `scripts/secrets-lint.sh`.
  secrets-lint:
    name: secrets-lint (no plaintext credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run secrets-lint
        run: bash scripts/secrets-lint.sh

  backend:
    name: backend (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # wave-A3 S5-audit L1: RavenDB.TestDriver's embedded server
      # runs against the .NET 8 runtime regardless of which SDK
      # builds the test assemblies. Without 8.x on PATH every
      # RavenTestDriver-backed test is a silent skip (see
      # Shared/DotNetRuntimeFacts), which historically masked
      # the secrets-migration coverage. Install both runtimes;
      # the test SDK uses 9.x and the embedded server uses 8.x.
      - name: Setup .NET (9 SDK + 8 runtime for RavenTestDriver)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore ./Dxs.Consigliere.sln

      - name: Test
        run: dotnet test ./Dxs.Consigliere.sln -c Release --no-restore /m:1 -v minimal

  admin-ui:
    name: admin-ui (Vite + MUI + MobX)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/admin-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable corepack (pnpm)
        run: corepack enable

      # wave-A2 S1: `pnpm verify` ends with `pnpm contracts:check`,
      # which spawns `dotnet run --emit-swagger` to regen the
      # OpenAPI spec and diff it against the committed snapshot.
      # The runner needs the .NET 9 SDK on PATH for that to work.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore .NET deps (warmup for swagger emit)
        working-directory: .
        run: dotnet restore ./Dxs.Consigliere.sln

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify (typecheck + lint + test + build + budget + inventory + contracts:check)
        run: pnpm verify

  admin-ui-contracts:
    name: admin-ui contracts (parity)
    needs: admin-ui
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: src/admin-ui

    # wave-A2 S2: real RavenDB as a service container so the
    # contract suite can boot the dotnet host + walk the setup
    # wizard against a live database. `RAVEN_PublicServerUrl` is
    # set to localhost:8080 so Raven's topology negotiation
    # returns a URL the dotnet client can actually reach.
    services:
      ravendb:
        image: ravendb/ravendb:7.1-latest
        ports:
          - 8080:8080
        env:
          RAVEN_License_Eula_Accepted: "true"
          RAVEN_Setup_Mode: "None"
          RAVEN_Security_UnsecuredAccessAllowed: "PublicNetwork"
          RAVEN_PublicServerUrl: "http://localhost:8080"
          RAVEN_ServerUrl: "http://0.0.0.0:8080"
        options: >-
          --health-cmd "wget -q --spider http://localhost:8080/setup/alive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore .NET deps
        working-directory: .
        run: dotnet restore ./Dxs.Consigliere.sln

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run contract parity tests
        env:
          RAVEN_URL: http://localhost:8080
        run: pnpm test:contract

      - name: Upload contracts on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: contracts-artifacts
          path: |
            src/admin-ui/contracts/swagger.json
            src/admin-ui/src/types/api.generated.ts
          retention-days: 7

  admin-ui-e2e:
    name: admin-ui e2e (Playwright)
    needs: admin-ui
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/admin-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm test:e2e:install

      - name: Run Playwright e2e (chromium + mobile-chromium)
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/admin-ui/playwright-report
          retention-days: 7

name: ci-tests

on:
  push:
    branches:
      - main
      - "codex-*"
      - "codex/*"
  pull_request:

jobs:
  backend:
    name: backend (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore ./Dxs.Consigliere.sln

      - name: Test
        run: dotnet test ./Dxs.Consigliere.sln -c Release --no-restore /m:1 -v minimal

  admin-ui:
    name: admin-ui (Vite + MUI + MobX)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/admin-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify (typecheck + lint + test + build)
        run: pnpm verify
